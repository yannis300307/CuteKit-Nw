[package]
name = "cutekit"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic="abort"

[profile.dev-opt]
inherits = "dev"
opt-level = 2
lto = "thin"
codegen-units = 16

[profile.release]
panic="abort"
lto = "fat"
strip = "debuginfo"
codegen-units = 1

[features]
default = ["draw_2d", "kibble"]
upsilon = ["nadk/upsilon"]
epsilon = ["nadk/epsilon"]
expose = []

draw_2d = []
draw_3d = []
kibble = []
ui = ["draw_2d"]

[dependencies.nadk]
path = "deps/nadk"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
heapless = { version = "0.9.3" }
glam = { version = "0.34.3", default-features = false, features = ["nostd-libm"]}
glam-traits = "0.3.2"
libm = "0.2.15"
include_bytes_aligned = "0.2.0"
enum-iterator = "2.3.0"
enum-map = "3.1.0"
