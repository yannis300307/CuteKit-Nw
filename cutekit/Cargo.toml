[package]
name = "cutekit"
version = "0.1.0"
edition = "2024"

[features]
default = ["handle_nadk", "draw_2d", "kibble"]
upsilon = ["nadk/upsilon"]
epsilon = ["nadk/epsilon"]
handle_nadk = []
expose = []

draw_2d = []
draw_3d = []
kibble = []
ui = ["draw_2d"]

[dependencies.nadk]
path = "nadk"

[dependencies]
nalgebra = {version = "0.33.2", default-features = false, features = ["libm", "bytemuck"]}
libm = "0.2.15"
heapless = { version = "0.9.3" }
cortex-m = {version="0.7.7", features=["critical-section-single-core"]}
embedded-alloc = "0.6.0"
postcard = {version = "1.1.2", features=["alloc"]}
serde = {version = "1.0.219", default-features=false}
enum-iterator = "2.3.0"
rand_core = "0.9.3"
bytemuck = { version = "1.25.0", features = ["derive"] }
include_bytes_aligned = "0.2.0"
readonly = "0.2.14"
enum-map = "3.1.0"

[build-dependencies]
image = "0.25.6"
cc = "1.2.27"
regex = "1.11.1"
serde = {version = "1.0.219", features = ["derive"]}
